services:
  library_api:
    build:
      context: .
      dockerfile: library_api/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      # Single source of truth for catalog.json + covers/ + books/.
      # Read-write: this container is now the one doing the actual
      # ingest work (POST /internal/ingest), triggered by the portrait
      # bot rather than a Discord connection of its own. Must be a named
      # volume, not the container's writable layer -- losing it means
      # every story has to be re-forwarded from Discord history, which
      # isn't automated (see README "Porting to another machine").
      - library_data:/data
    ports:
      - "${LIBRARY_API_PORT:-8083}:8000"
    networks:
      - default
      # Shared with auldwyn-portrait-bot's `bot` service so it can reach
      # this container by name (http://library_api:8000/internal/ingest)
      # without going out through the host's published port. Created
      # once with `docker network create auldwyn-net` -- see README.
      - auldwyn-net
    mem_limit: 512m
    cpus: "1.0"

  calibre_converter:
    build:
      context: .
      dockerfile: calibre_converter/Dockerfile
    restart: unless-stopped
    networks:
      # Internal only -- no ports: published, no host port mapping.
      # Reached by library_api at http://calibre_converter:8000 (see
      # CALIBRE_CONVERTER_URL in .env.example), same shared-network
      # convention library_api and the portrait bot already use.
      - auldwyn-net
    # Stock Calibre wants real headroom to run ebook-convert -- a
    # different order of magnitude than library_api's own 512m above.
    # No volume: this service is stateless, one epub in over HTTP, one
    # azw3 back out, nothing written that needs to survive a restart.
    mem_limit: 2g
    cpus: "1.0"

volumes:
  library_data:

networks:
  auldwyn-net:
    external: true
